name: Release
on: {push: {tags: ['v*.*.*']}}
permissions: {contents: write, packages: write, id-token: write, attestations: write}
concurrency: {group: "release-${{ github.ref }}", cancel-in-progress: false}
jobs:
  verify-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: pip install -e '.[dev]'
      - name: Import release signing public key
        env:
          RELEASE_GPG_PUBLIC_KEY: '${{ secrets.RELEASE_GPG_PUBLIC_KEY }}'
        run: |
          test -n "$RELEASE_GPG_PUBLIC_KEY"
          printf '%s' "$RELEASE_GPG_PUBLIC_KEY" | gpg --batch --import
      - name: Verify signed, matching release tag
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
          git tag -v "$GITHUB_REF_NAME"
      - run: scripts/release-check.sh
      - uses: docker/login-action@v3
        with: {username: '${{ secrets.DOCKERHUB_USERNAME }}', password: '${{ secrets.DOCKERHUB_TOKEN }}'}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: desalvo/colf-manager
          tags: |
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: '${{ steps.meta.outputs.tags }}'
          labels: '${{ steps.meta.outputs.labels }}'
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v2
        with: {subject-path: 'dist/*'}
      - uses: softprops/action-gh-release@v2
        with: {files: 'dist/*', generate_release_notes: true, fail_on_unmatched_files: true}
