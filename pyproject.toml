[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "colf-manager"
version = "1.0.0"
description = "Private household employment time, leave, expense and payroll support manager"
readme = "README.md"
license = {text = "EUPL-1.2"}
authors = [{name = "Alessandro De Salvo", email = "braket71@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4", "Flask-SQLAlchemy>=3.1,<4", "Flask-Login>=0.6,<1",
  "Flask-WTF>=1.2,<2", "Flask-Migrate>=4.1,<5", "Flask-Limiter>=4.1.1,<5",
  "psycopg[binary]>=3.2,<4", "gunicorn>=23,<24", "reportlab>=4.4,<5",
  "openpyxl>=3.1,<4", "python-dateutil>=2.9,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=6,<8", "ruff>=0.12,<0.16", "bandit>=1.8", "pip-audit>=2.9", "build>=1.3", "twine>=7,<8", "cyclonedx-bom>=6", "pypdf>=5,<7"]

[project.scripts]
colf-manager = "colf_manager.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/colf_manager"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["DTZ007", "DTZ011", "EXE001", "FURB157"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=colf_manager --cov-report=term-missing --cov-fail-under=65"
