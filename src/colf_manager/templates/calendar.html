{% extends 'base.html' %}{% block head %}<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.css" rel="stylesheet">{% endblock %}{% block content %}<div class="page-title"><span class="eyebrow">Trascina, copia, pianifica</span><h1>Calendario delle ore</h1><p>Gli eventi possono essere spostati rapidamente su un nuovo giorno.</p></div><div class="calendar-layout"><section class="card"><div class="toolbar"><select id="workerFilter"><option value="">Tutte le lavoratrici</option>{% for w in workers %}<option value="{{w.id}}">{{w.first_name}} {{w.last_name}}</option>{% endfor %}</select><button onclick="openModal()">+ Registra ore</button></div><div id="calendar"></div></section><aside class="side-card"><h3>Assenza</h3><form method="post" action="/absences"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Lavoratrice<select name="worker_id">{% for w in workers %}<option value="{{w.id}}">{{w.first_name}} {{w.last_name}}</option>{% endfor %}</select></label><label>Tipo<select name="kind"><option value="vacation">Ferie</option><option value="sickness">Malattia</option><option value="unpaid_leave">Permesso non retribuito</option></select></label><label>Dal<input type="date" name="start_date" required></label><label>Al<input type="date" name="end_date" required></label><label class="check"><input type="checkbox" name="paid"> Retribuita</label><label>Ore pagate totali nel periodo<input type="number" min="0" step=".25" name="paid_hours"></label><button>Registra</button></form></aside></div><dialog id="workDialog"><form id="workForm"><button type="button" class="close" onclick="workDialog.close()">×</button><h2>Registra ore</h2><label>Lavoratrice<select name="worker_id" required>{% for w in workers %}<option value="{{w.id}}">{{w.first_name}} {{w.last_name}}</option>{% endfor %}</select></label><label>Data<input type="date" name="work_date" required></label><div class="formgrid"><label>Inizio<input type="time" name="start_time" required value="09:00"></label><label>Fine<input type="time" name="end_time" required value="13:00"></label></div><label>Luogo<input name="location" required placeholder="Abitazione principale"></label><label>Pausa (minuti)<input type="number" min="0" name="break_minutes" value="0"></label><button>Salva nel calendario</button></form></dialog>{% endblock %}{% block scripts %}<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script><script src="{{url_for('static',filename='calendar.js')}}"></script>{% endblock %}
