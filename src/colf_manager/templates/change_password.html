{% extends 'base.html' %}{% block content %}<div class="page-title"><span class="eyebrow">Sicurezza account</span><h1>Cambia password</h1><p>Usa almeno 12 caratteri, includendo lettere e numeri.</p></div><section class="card"><form method="post" class="formgrid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Password attuale<input type="password" name="current_password" required autocomplete="current-password"></label><label>Nuova password<input type="password" name="new_password" required minlength="12" autocomplete="new-password"></label><label>Conferma nuova password<input type="password" name="confirm_password" required minlength="12" autocomplete="new-password"></label><button>Aggiorna password</button></form></section>{% endblock %}
