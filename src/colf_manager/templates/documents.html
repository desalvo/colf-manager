{% extends 'base.html' %}{% block content %}<div class="page-title"><span class="eyebrow">Archivio riservato</span><h1>Documenti</h1></div><div class="grid2"><section class="card"><h2>Carica documento</h2><form method="post" enctype="multipart/form-data"><label>Lavoratrice<select name="worker_id">{% for w in workers %}<option value="{{w.id}}">{{w.first_name}} {{w.last_name}}</option>{% endfor %}</select></label><label>Categoria<select name="category"><option>contratto</option><option>ricevuta</option><option>certificato</option><option>altro</option></select></label><label>File<input type="file" name="file" required></label><button>Carica</button></form></section><section class="card"><h2>Archivio</h2>{% for d in documents %}<a class="document" href="/documents/{{d.id}}"><span>▤</span><div><b>{{d.filename}}</b><small>{{d.category}} · {{d.uploaded_at.strftime('%d/%m/%Y')}}</small></div></a>{% else %}<p>Nessun documento.</p>{% endfor %}</section></div>{% endblock %}
