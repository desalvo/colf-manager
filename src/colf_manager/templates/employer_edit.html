{% extends 'base.html' %}{% block content %}<div class="page-title"><span class="eyebrow">Modifica anagrafica</span><h1>{{employer.first_name}} {{employer.last_name}}</h1></div><section class="card"><form method="post" class="formgrid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nome<input name="first_name" value="{{employer.first_name}}" required></label><label>Cognome<input name="last_name" value="{{employer.last_name}}" required></label><label>Codice fiscale<input name="fiscal_code" value="{{employer.fiscal_code or ''}}"></label><label>Data di nascita<input type="date" name="birth_date" value="{{employer.birth_date or ''}}"></label><label>Indirizzo<input name="address" value="{{employer.address or ''}}"></label><label>Città<input name="city" value="{{employer.city or ''}}"></label><label>Provincia<input name="province" maxlength="2" value="{{employer.province or ''}}"></label><label>CAP<input name="postal_code" maxlength="10" value="{{employer.postal_code or ''}}"></label><label>Telefono<input name="phone" value="{{employer.phone or ''}}"></label><label>E-mail<input type="email" name="email" value="{{employer.email or ''}}"></label><label class="span2">Note<textarea name="notes" rows="4">{{employer.notes or ''}}</textarea></label><button>Salva modifiche</button><a class="button secondary" href="/employers/{{employer.id}}">Annulla</a></form></section>{% endblock %}
