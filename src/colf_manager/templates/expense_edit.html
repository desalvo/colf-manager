{% extends 'base.html' %}{% block content %}<div class="page-title"><span class="eyebrow">Rettifica movimento</span><h1>Modifica spesa</h1></div><section class="card form-card"><form method="post" class="formgrid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Lavoratore<select name="worker_id">{% for w in workers %}<option value="{{w.id}}" {% if w.id==expense.worker_id %}selected{% endif %}>{{w.first_name}} {{w.last_name}}</option>{% endfor %}</select></label><label>Data<input type="date" name="expense_date" value="{{expense.expense_date}}" required></label><label class="span2">Descrizione<input name="description" value="{{expense.description}}" required></label><label>Importo (€)<input type="number" min="0" step=".01" name="amount" value="{{expense.amount}}" required></label><label>Direzione<select name="direction"><option value="employer_advance" {% if expense.direction=='employer_advance' %}selected{% endif %}>Sostenuta dal datore</option><option value="worker_advance" {% if expense.direction=='worker_advance' %}selected{% endif %}>Sostenuta dal lavoratore</option></select></label><label class="check span2"><input type="checkbox" name="reimbursed" {% if expense.reimbursed %}checked{% endif %}> Già regolata/rimborsata</label><div class="span2 form-actions"><a class="button secondary" href="/expenses">Annulla</a><button>Salva modifiche</button></div></form></section>{% endblock %}
