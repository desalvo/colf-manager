{% extends 'base.html' %}{% block content %}<div class="page-title"><span class="eyebrow">Rettifica compensazione</span><h1>Modifica compensazione</h1><p>{{expense.description}}</p></div><section class="card form-card"><form method="post" class="formgrid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Data<input type="date" name="settlement_date" value="{{settlement.settlement_date}}" required></label><label>Importo (€)<input type="number" min="0.01" step=".01" name="amount" value="{{settlement.amount}}" required></label><label>Modalità<select name="method">{% for value,label in [('cash','Contanti'),('bank_transfer','Bonifico'),('card','Carta'),('electronic','Altro elettronico'),('other','Altro')] %}<option value="{{value}}" {% if settlement.method==value %}selected{% endif %}>{{label}}</option>{% endfor %}</select></label><label class="span2">Note<textarea name="notes" rows="3">{{settlement.notes or ''}}</textarea></label><div class="span2 form-actions"><a class="button secondary" href="/expenses/{{expense.id}}">Annulla</a><button>Salva modifiche</button></div></form></section>{% endblock %}
