{% extends 'base.html' %}{% block content %}<div class="page-title"><span class="eyebrow">Modifica luogo</span><h1>{{location.name}}</h1></div><section class="card"><form method="post" class="formgrid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nome<input name="name" maxlength="160" value="{{location.name}}" required></label><label>Indirizzo<input name="address" value="{{location.address or ''}}"></label><label class="span2">Note<textarea name="notes" rows="4">{{location.notes or ''}}</textarea></label><button>Salva modifiche</button><a class="button secondary" href="/locations/{{location.id}}">Annulla</a></form></section>{% endblock %}
