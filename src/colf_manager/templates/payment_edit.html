{% extends 'base.html' %}{% block content %}<div class="page-title"><span class="eyebrow">Modifica pagamento</span><h1>Pagamento #{{payment.id}}</h1></div><section class="card"><form method="post" enctype="multipart/form-data" class="formgrid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Lavoratore<select name="worker_id" id="paymentWorker" required>{% for w in workers %}<option value="{{w.id}}" data-inps="{{1 if w.inps_number else 0}}" {% if payment.worker_id==w.id %}selected{% endif %}>{{w.first_name}} {{w.last_name}}</option>{% endfor %}</select></label><label>Tipo<select name="payment_type" id="paymentType">{% for key,label in payment_labels.items() %}<option value="{{key}}" {% if key=='inps_contributions' %}id="inpsPaymentOption"{% endif %} {% if payment.payment_type==key %}selected{% endif %}>{{label}}</option>{% endfor %}</select></label><label>Importo €<input type="number" name="amount" min="0" step=".01" value="{{payment.amount}}" required></label><label>Stato<select name="status"><option value="pending" {% if payment.status=='pending' %}selected{% endif %}>Da pagare</option><option value="paid" {% if payment.status=='paid' %}selected{% endif %}>Pagato</option></select></label><label>Data pagamento<input type="date" name="payment_date" value="{{payment.payment_date or ''}}"></label><label>Inizio periodo<input type="date" name="period_start" value="{{payment.period_start or ''}}"></label><label>Fine periodo<input type="date" name="period_end" value="{{payment.period_end or ''}}"></label><label>Descrizione<input name="description" value="{{payment.description or ''}}"></label><label class="span2">Aggiungi allegati<input type="file" name="attachments" multiple accept="application/pdf,image/*"></label><label class="span2">Note<textarea name="notes" rows="4">{{payment.notes or ''}}</textarea></label><button>Salva</button><a class="button secondary" href="/payments/{{payment.id}}">Annulla</a></form></section>{% endblock %}{% block scripts %}<script>(()=>{const w=document.getElementById('paymentWorker');const t=document.getElementById('paymentType');const i=document.getElementById('inpsPaymentOption');const sync=()=>{const o=w?.selectedOptions?.[0];const ok=o?.dataset?.inps==='1';if(i)i.disabled=!ok;if(!ok&&t?.value==='inps_contributions')t.value='salary';};w?.addEventListener('change',sync);sync();})();</script>{% endblock %}
