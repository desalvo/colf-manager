{% extends 'base.html' %}{% block content %}<div class="page-title"><span class="eyebrow">Modifica storico</span><h1>Modifica tariffa</h1></div><section class="card form-card"><form method="post" class="formgrid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Lavoratore<select name="worker_id">{% for w in workers %}<option value="{{w.id}}" {% if w.id==rate.worker_id %}selected{% endif %}>{{w.first_name}} {{w.last_name}}</option>{% endfor %}</select></label><label>Decorrenza<input type="date" name="valid_from" value="{{rate.valid_from}}" required></label><label>Tariffa €/ora<input type="number" min="0" step=".01" name="amount" value="{{rate.amount}}" required></label><label>Note<input name="notes" value="{{rate.notes or ''}}"></label><div class="span2 form-actions"><a class="button secondary" href="/rates">Annulla</a><button>Salva modifiche</button></div></form></section>{% endblock %}
