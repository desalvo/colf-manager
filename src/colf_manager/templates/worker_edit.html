{% extends 'base.html' %}{% block content %}<div class="page-title"><span class="eyebrow">Modifica anagrafica</span><h1>{{worker.first_name}} {{worker.last_name}}</h1></div><section class="card"><form method="post" enctype="multipart/form-data" class="formgrid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nome<input name="first_name" value="{{worker.first_name}}" required></label><label>Cognome<input name="last_name" value="{{worker.last_name}}" required></label><label>Datore<select name="employer_id"><option value="">Non associato</option>{% for e in employers %}<option value="{{e.id}}" {% if worker.employer_id==e.id %}selected{% endif %}>{{e.first_name}} {{e.last_name}}</option>{% endfor %}</select></label><label>Codice fiscale<input name="fiscal_code" value="{{worker.fiscal_code or ''}}"></label><label>Data di nascita<input type="date" name="birth_date" value="{{worker.birth_date or ''}}"></label><label>Posizione / rapporto INPS<input name="inps_number" value="{{worker.inps_number or ''}}"></label><label>Numero contratto<input name="contract_number" value="{{worker.contract_number or ''}}"></label><label>Tipo contratto<select name="contract_type"><option value="permanent" {% if worker.contract_type=='permanent' %}selected{% endif %}>Tempo indeterminato</option><option value="fixed_term" {% if worker.contract_type=='fixed_term' %}selected{% endif %}>Tempo determinato</option></select></label><label>Indirizzo<input name="address" value="{{worker.address or ''}}"></label><label>Città<input name="city" value="{{worker.city or ''}}"></label><label>Provincia<input name="province" maxlength="2" value="{{worker.province or ''}}"></label><label>CAP<input name="postal_code" maxlength="10" value="{{worker.postal_code or ''}}"></label><label>Telefono<input name="phone" value="{{worker.phone or ''}}"></label><label>E-mail<input type="email" name="email" value="{{worker.email or ''}}"></label><label>Assunzione<input type="date" name="employment_start" value="{{worker.employment_start}}" required></label><label>Fine rapporto<input type="date" name="employment_end" value="{{worker.employment_end or ''}}"></label><label>Ore settimanali<input type="number" min="0" step=".25" name="weekly_hours" value="{{worker.weekly_hours or 0}}"></label><label class="check span2"><input type="checkbox" name="employer_covers_all_taxes" {% if worker.employer_covers_all_taxes %}checked{% endif %}> Datore si fa carico anche delle quote contributive/fiscali del lavoratore (stima)</label><label class="check span2"><input type="checkbox" name="vacation_advance_allowed" {% if worker.vacation_advance_allowed %}checked{% endif %}> Consenti ferie maturabili entro fine anno</label><label class="span2">Firma grafica{% if worker.signature_filename %}<span class="fineprint">Attuale: {{worker.signature_filename}}</span>{% endif %}<input type="file" name="signature" accept="image/png,image/jpeg,image/tiff,image/webp,image/bmp"></label>{% if worker.signature_stored_name %}<label class="check span2"><input type="checkbox" name="remove_signature" value="1"> Rimuovi la firma registrata</label>{% endif %}<label class="span2">Note<textarea name="notes" rows="4">{{worker.notes or ''}}</textarea></label><button>Salva modifiche</button><a class="button secondary" href="/workers/{{worker.id}}">Annulla</a></form></section>{% endblock %}
